services:
  - type: web
    name: nexora-backend
    env: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build -w shared && npm run build -w backend
    startCommand: node backend/dist/index.js
    healthCheckPath: /api/health
    preDeployCommand: npm run migrate -w backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: LICENSE_HMAC_SECRET
        generateValue: true
      - key: ADMIN_ORIGIN
        sync: false
      - key: EXTENSION_ORIGIN
        sync: false

databases:
  - name: nexora-db
    databaseName: nexora
    user: nexora
    plan: starter
